[project]
name = "afmco"
authors = [
    { name = "AFMCO", email = "afm@afmcoltd.com"}
]
description = "Payment Requisition, Advance Leave Salary and End of Service Settlement"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["pikepdf>=9.0.0,<11.0.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
