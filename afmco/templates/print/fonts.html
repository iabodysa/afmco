{%- set afm_fonts = frappe.utils.get_url() ~ "/assets/afmco/fonts" -%}
<style>
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 400; src: url("{{ afm_fonts }}/Montserrat-Regular.ttf") format("truetype"); unicode-range: U+0000-024F, U+2000-206F, U+20AC; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 500; src: url("{{ afm_fonts }}/Montserrat-Medium.ttf") format("truetype"); unicode-range: U+0000-024F, U+2000-206F, U+20AC; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; src: url("{{ afm_fonts }}/Montserrat-SemiBold.ttf") format("truetype"); unicode-range: U+0000-024F, U+2000-206F, U+20AC; }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; src: url("{{ afm_fonts }}/Montserrat-Bold.ttf") format("truetype"); unicode-range: U+0000-024F, U+2000-206F, U+20AC; }
@font-face { font-family: "Tajawal"; font-style: normal; font-weight: 400; src: url("{{ afm_fonts }}/Tajawal-Regular.ttf") format("truetype"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Tajawal"; font-style: normal; font-weight: 500; src: url("{{ afm_fonts }}/Tajawal-Medium.ttf") format("truetype"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
@font-face { font-family: "Tajawal"; font-style: normal; font-weight: 700; src: url("{{ afm_fonts }}/Tajawal-Bold.ttf") format("truetype"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200F, U+FB50-FDFF, U+FE70-FEFF; }
.print-format, .print-format table, .print-format th, .print-format td, .print-format p, .print-format div, .print-format span, .print-format h1, .print-format h2, .print-format h3, .print-format h4, .print-format h5, .print-format h6, .print-format label, .print-format small, .print-format b, .print-format strong { font-family: "Montserrat", "Tajawal", sans-serif; }
</style>
